name: Android Release APK

on:
  push:
    branches: [dev, 'prerelease/v*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag and app version (e.g. v2.01 or 2.01). Empty: generate a unique version.'
        required: false
        type: string
      title:
        description: Release title. Leave empty to auto-generate.
        required: false
        type: string
      publish:
        description: 'Publish a new public GitHub Release after building (leave off for verification only).'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark the published release as a pre-release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/prerelease/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEKO_PRERELEASE: ${{ (inputs.prerelease || github.ref_name == 'dev' || startsWith(github.ref, 'refs/heads/prerelease/v')) && '1' || '0' }}
  NEKO_PUBLISH_PRERELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/prerelease/v') && contains(github.event.head_commit.message, '[publish prerelease]') && 'true' || 'false' }}
  NEKO_REFRESH_PRERELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/prerelease/v') && contains(github.event.head_commit.message, '[refresh prerelease assets]') && 'true' || 'false' }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
  ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_name == 'dev' && contains(github.event.head_commit.message, '[build]')) ||
      (startsWith(github.ref, 'refs/heads/prerelease/v') &&
        (contains(github.event.head_commit.message, '[publish prerelease]') ||
         contains(github.event.head_commit.message, '[refresh prerelease assets]')))
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare release version and notes
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          if [ "$NEKO_PUBLISH_PRERELEASE" = true ] || [ "$NEKO_REFRESH_PRERELEASE" = true ]; then
            export INPUT_TAG="${GITHUB_REF_NAME#prerelease/}"
          fi
          python3 .github/scripts/prepare_release.py
      - name: Check GitHub release before building
        if: inputs.publish || env.NEKO_PUBLISH_PRERELEASE == 'true' || env.NEKO_REFRESH_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$NEKO_REFRESH_PRERELEASE" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.prerelease and (.draft | not) and (.immutable | not)' | grep -qx true
          elif gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install required Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-21" "platforms;android-35" "build-tools;35.0.1" "ndk;28.0.13004108"
          chmod +x gradlew buildScript/lib/core.sh buildScript/lib/core/init.sh buildScript/lib/core/build.sh buildScript/lib/core/get_source.sh libcore/init.sh libcore/build.sh
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASS" ] || [ -z "$ALIAS_NAME" ] || [ -z "$ALIAS_PASS" ]; then
              echo "KEYSTORE_BASE64 requires KEYSTORE_PASS, ALIAS_NAME and ALIAS_PASS."
              exit 1
            fi
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            rm -f release.keystore
          fi
      - name: Prepare pinned core dependencies and tools
        run: ./buildScript/lib/core/init.sh
      - name: Bundle pinned GeoIP and GeoSite databases
        run: ./buildScript/lib/assets.sh
      - name: Test two-database backup restore
        run: python3 buildScript/tests/test_restore_transaction.py
      - name: Test release metadata
        run: python3 .github/scripts/test_prepare_release.py
      - name: Check UI resources and fixed palette contrast
        run: python3 buildScript/tests/test_ui_resources.py
      - name: Test Go core with race detection
        working-directory: libcore
        env:
          NEKO_ROUTE_ASSET_TEST_DIR: ../app/src/main/assets/sing-box
        shell: bash
        run: go test -race -tags=with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api . ./warp github.com/sagernet/sing-box/log github.com/sagernet/sing-box/protocol/group github.com/sagernet/sing-box/transport/wireguard github.com/sagernet/sing-box/protocol/http github.com/sagernet/sing-box/common/kmutex github.com/sagernet/sing-box/common/expiringmap github.com/sagernet/sing-box/common/dialer github.com/sagernet/sing-quic/congestion_meta2 github.com/sagernet/sing-box/protocol/vless/encryption 2>&1 | tee ../go-test.log
      - name: Build libcore AAR once
        run: ./buildScript/lib/core/build.sh
      - name: Test and build release APKs
        run: ./gradlew --no-daemon --no-build-cache -Pksp.incremental=false -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process :app:testOssReleaseUnitTest :app:assembleOssRelease
      - name: Verify and collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          python3 .github/scripts/verify_apks.py app/build/outputs/apk/oss/release release-assets/APK-VERIFICATION.json
          cp app/build/outputs/apk/oss/release/*.apk release-assets/
          python3 .github/scripts/build_manifest.py release-assets/BUILD-MANIFEST.json release-assets/APK-VERIFICATION.json
          (cd release-assets && sha256sum *.apk BUILD-MANIFEST.json APK-VERIFICATION.json > SHA256SUMS.txt)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            go-test.log
          if-no-files-found: ignore
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: release-assets/
      - name: Replace verified pre-release assets
        if: env.NEKO_REFRESH_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/refresh_prerelease_assets.py release-assets
      - name: Publish GitHub release
        if: env.NEKO_REFRESH_PRERELEASE != 'true' && (inputs.publish || env.NEKO_PUBLISH_PRERELEASE == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          OPTIONS=()
          if [ "$NEKO_PRERELEASE" = 1 ]; then OPTIONS+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.txt "${OPTIONS[@]}"
